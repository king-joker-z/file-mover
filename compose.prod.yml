version: "3"

services:
  file-mover:
    image: king-joker-z/file-mover:1.9.0   # v1.9.0，amd64 + arm64
    container_name: file-mover
    restart: unless-stopped
    ports:
      - "8787:8787"                          # Web UI: http://NAS-IP:8787
    volumes:
      # ===== 改成你自己的路径 =====
      - /vol1/1000/docker/file-mover/local:/data/local     # 源目录：要迁移的本地文件
      - /vol2/mount/cloud-drive:/data/cloud                # 目标目录：远程网盘挂载点（rclone mount / SMB / NFS 等）
      - /vol1/1000/docker/file-mover/config:/app/config    # 配置与 SQLite 数据库持久化（必须挂载，否则重启丢队列）
      # 需要更多源/目标目录时，按同样方式追加挂载即可，数量不限：
      # - /vol1/1000/downloads2:/data/local2
      # - /vol2/mount/another-cloud:/data/cloud2
      # Web 页「选择目录」会列出 /data 下全部挂载；任务源/目标选其中任意目录即可。
      # 若目标不在 /data/cloud 下，无需额外配置；/data/cloud 的网盘掉载保护仅作用于该挂载。
    environment:
      - TZ=Asia/Shanghai
      - FILEMOVER_API_TOKEN=${FILEMOVER_API_TOKEN:?Set FILEMOVER_API_TOKEN before exposing port 8787}
      # 可选：文件权限映射（跨挂载 chown 报错时再启用）
      # - PUID=1000
      # - PGID=1000
    # 显式覆盖旧项目可能保留的 /api/dashboard 探针；无需 API Token 或数据库。
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=5).close()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

# 极空间注意事项：
# 1. 三个 volume 路径改为极空间里实际存在的目录；
#    极空间 Docker UI 挂载时把宿主机目录映射到上面等号右边的容器路径即可。
# 2. 网盘挂载建议由宿主机（如 rclone mount --allow-other）或另一容器完成，
#    本容器只读写挂载点；网盘不稳定时到 Web UI「设置」开启安全模式（copy+校验+删源）。
# 3. /app/config 不挂载的话，容器重建会丢失任务、队列与日志。
