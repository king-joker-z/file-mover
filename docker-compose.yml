version: "3"
services:
  file-mover:
    build: .
    container_name: file-mover
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - /path/to/local:/data/local        # 源目录（改成你的本地目录）
      - /path/to/cloud-mount:/data/cloud  # 目标目录（网盘挂载点）
      - ./config:/app/config              # 配置与 SQLite 持久化
      # 需要更多源/目标目录时按同样格式追加，数量不限，例如：
      # - /path/to/local2:/data/local2
      # - /path/to/another-cloud:/data/cloud2
      # Web 页目录选择器会列出 /data 下全部挂载目录。
    environment:
      - TZ=Asia/Shanghai
      - FILEMOVER_API_TOKEN=${FILEMOVER_API_TOKEN:?Set FILEMOVER_API_TOKEN before exposing port 8787}
